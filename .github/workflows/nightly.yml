name: Nightly Jobber refresh

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Write .env from secrets
        run: |
          cat > .env <<EOF
          JOBBER_CLIENT_ID=${{ secrets.JOBBER_CLIENT_ID }}
          JOBBER_CLIENT_SECRET=${{ secrets.JOBBER_CLIENT_SECRET }}
          JOBBER_REFRESH_TOKEN=${{ secrets.JOBBER_REFRESH_TOKEN }}
          EOF

      - name: Run Jobber puller
        run: python scripts/jobber_pull.py

      - name: Commit and push if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data.json docs/index.html
          if git diff --cached --quiet; then
            echo "No data changes - skipping commit"
          else
            git commit -m "chore: nightly Jobber refresh $(date -u +%Y-%m-%d)"
            git push
          fi
